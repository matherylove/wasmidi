name: Build Qt WASM and Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'
  EMSCRIPTEN_VERSION: '3.1.56'

jobs:
  build-wasm:
    name: Qt 6.8 WebAssembly
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Install Qt WebAssembly
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: wasm
          arch: wasm_singlethread
          cache: true
          aqtversion: '==3.3.*'

      - name: Toolchain diagnostics
        run: |
          emcc --version
          cmake --version
          echo "QT_ROOT_DIR=${QT_ROOT_DIR}"
          echo "QT_HOST_PATH=${QT_HOST_PATH}"
          test -f "${QT_ROOT_DIR}/lib/cmake/Qt6/qt.toolchain.cmake"
          test -d "${QT_HOST_PATH}"

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${QT_ROOT_DIR}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DQT_HOST_PATH="${QT_HOST_PATH}"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site

          test -s build/wasmidi.html
          test -s build/wasmidi.js
          test -s build/wasmidi.wasm

          cp build/wasmidi.html site/index.html
          cp build/wasmidi.js site/
          cp build/wasmidi.wasm site/

          if [[ -f build/qtloader.js ]]; then cp build/qtloader.js site/; fi
          if [[ -f build/wasmidi.data ]]; then cp build/wasmidi.data site/; fi
          if [[ -f build/wasmidi.worker.js ]]; then cp build/wasmidi.worker.js site/; fi

          touch site/.nojekyll

          echo "Deployment files:"
          find site -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

          test -s site/index.html
          test -s site/wasmidi.js
          test -s site/wasmidi.wasm

      - name: Upload reproducible WASM build
        uses: actions/upload-artifact@v4
        with:
          name: wasmidi-wasm-${{ github.sha }}
          path: site
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-wasm
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
