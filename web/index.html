<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WASMIDI Player</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07071a;
    }
    
    #qtcontainer {
      width: 100%;
      height: 100%;
    }
    
    #qtloading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #07071a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    
    #qtloading h1 {
      color: #c4b5fd;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2em;
      margin-bottom: 20px;
    }
    
    #qtloading .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #5b21b6;
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="qtloading">
    <h1>🎹 WASMIDI Player</h1>
    <div class="spinner"></div>
    <p style="color: #94a3b8; margin-top: 20px;">Loading Qt/WASM...</p>
  </div>
  
  <div id="qtcontainer"></div>
  
  <script>
    var Module = {
      onRuntimeInitialized: function() {
        document.getElementById('qtloading').style.display = 'none';
      },
      canvas: document.getElementById('qtcanvas')
    };
  </script>
  <script src="wasmidi.js"></script>
</body>
</html>
